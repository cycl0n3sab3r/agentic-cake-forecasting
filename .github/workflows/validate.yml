name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Validate graph against evidence
        run: |
          python scripts/validate_graph.py \
            data/graphs/cake_graph_v1.yaml \
            data/evidence/seed_evidence.csv \
            --allow-drift  # TODO: drop once cake_graph_v2 reconciles the two
